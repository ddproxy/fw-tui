name: Dependency Review

on: pull_request

permissions: {}

jobs:
  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          license-configuration: allow
          # Keep in sync with [licenses].allow in deny.toml.
          allow-licenses: >-
            MIT, Apache-2.0, Apache-2.0 WITH LLVM-exception, BSD-3-Clause,
            BSL-1.0, CDLA-Permissive-2.0, ISC, Unicode-3.0, Unlicense, Zlib
